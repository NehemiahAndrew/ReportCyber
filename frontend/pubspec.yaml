name: reportcyber
description: Crowdsourced Cyber Reporting Platform

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  
  # Navigation
  go_router: ^17.0.1
  
  # Network
  dio: ^5.4.0
  retrofit: ^4.0.3
  
  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Firebase
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  firebase_storage: ^13.0.5
  
  # Authentication
  google_sign_in: ^7.2.0
  
  # UI Components
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.0
  
  # Forms
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.2.0
  
  # Rich Text Editor
  flutter_quill: ^11.5.0
  
  # File Handling
  file_picker: ^10.3.7
  image_picker: ^1.0.7
  image_cropper: ^11.0.0
  
  # Utilities
  intl: any
  uuid: ^4.2.2
  url_launcher: ^6.2.2
  share_plus: ^12.0.1
  permission_handler: ^12.0.1
  geolocator: ^14.0.2
  
  # 2FA
  otp_text_field: ^1.1.3
  qr_code_scanner: ^1.0.1
  
  # Notifications
  flutter_local_notifications: ^19.5.0
  
  # Charts for Analytics
  fl_chart: ^1.1.1
  
  # Connectivity
  connectivity_plus: ^7.0.0
  
  # JSON Serialization
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1
  get_it: ^9.2.0
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^6.0.0
  build_runner: ^2.4.7
  retrofit_generator: ^8.0.6
  json_serializable: ^6.7.1
  freezed: ^2.4.6
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
